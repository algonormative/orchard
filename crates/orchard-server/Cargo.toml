[package]
name = "orchard-server"
version = "0.1.0"
description = "Portable local web server for Orchard workspaces"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "orchard"
path = "src/main.rs"

[dependencies]
axum = "=0.8.6"
base64 = "=0.22.1"
orchard-workspace-host = { version = "=0.1.0", path = "../orchard-workspace-host" }
rmcp = { version = "=3.2.0", features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "=0.13.5", default-features = false }
serde_json = "=1.0.145"
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
url = "=2.5.8"

[build-dependencies]
sha2 = "=0.10.9"

[dev-dependencies]
tempfile = "=3.23.0"
tower = { version = "=0.5.2", features = ["util"] }

[lints]
workspace = true
